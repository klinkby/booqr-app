x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    build: ..
    read_only: true
    tmpfs:
      - '/tmp:mode=1777,noexec,nosuid'
    volumes:
      - './app_sock:/var/run/lighttpd'
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    restart: unless-stopped
    network_mode: none
    logging: *logging
    healthcheck:
      test:
        - CMD-SHELL
        - test -S /var/run/lighttpd/sock
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 64M
        reservations:
          cpus: '0.1'
          memory: 16M
  socat:
    image: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    command: sh -c 'apk add --no-cache -q socat && exec socat TCP-LISTEN:3000,fork,reuseaddr UNIX-CONNECT:/var/run/lighttpd/sock'
    ports:
      - '3000:3000'
    volumes:
      - './app_sock:/var/run/lighttpd:ro'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
